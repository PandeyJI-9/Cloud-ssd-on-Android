name: Build & Release Cloud SSD Magisk Module

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build All-in-One Flashable Magisk Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip curl jq

      - name: Run Module Builder
        run: |
          chmod +x scripts/build_magisk_module.sh
          bash scripts/build_magisk_module.sh

      - name: Verify Built ZIP
        run: |
          ls -lh CloudSSD-TeraBox-v1.0.0.zip
          unzip -l CloudSSD-TeraBox-v1.0.0.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudSSD-TeraBox-Magisk-Module-ARM64
          path: CloudSSD-TeraBox-v1.0.0.zip

      - name: Publish GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Cloud SSD Magisk Module ${{ github.ref_name }} (Zero-Bootloop + WebUI)"
          files: CloudSSD-TeraBox-v1.0.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
